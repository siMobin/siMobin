name: Build CV From Source

on:
  push:
    branches:
      - main
    paths:
      - "CV/**"
      - "**/cv-generator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # Build Full CV
      # ---------------------------
      - name: Build Full CV
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: CV
          root_file: main.tex
          latexmk_use_xelatex: true
          args: >
            -jobname=${{ github.actor }}-full
            -pdf

      # ---------------------------
      # Build Minimal CV
      # ---------------------------
      - name: Build Minimal CV
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: CV
          root_file: minimal.tex
          latexmk_use_xelatex: true
          pre_compile: |
            echo '\def\MINIMALCV{}\input{main.tex}' > minimal.tex
          args: >
            -jobname=${{ github.actor }}-minimal
            -pdf

      # ---------------------------
      # Copy PDFs
      # ---------------------------
      - name: Copy PDFs
        run: |
          mkdir -p CV/pdf

          cp CV/*.pdf CV/pdf/

      # ---------------------------
      # Commit changes
      # ---------------------------
      - name: Commit changes to repo
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CV/pdf/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(cv): `update` (date=$(date -u +%Y%m%d))"
          git push
