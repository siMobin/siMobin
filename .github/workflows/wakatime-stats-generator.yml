name: Update WakaTime Stats

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "wakatime-stats/**"
  schedule:
    - cron: "0 12 * * 5" # every Friday at 12:00
  workflow_dispatch:

# Cancel any in-progress runs of this workflow when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r wakatime-stats/requirements.txt

      - name: Generate all SVGs from local project
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p wakatime
          python wakatime-stats/main.py --theme tokyo_night_transparent
          cp wakatime-stats/output/*.svg wakatime/

      - name: Bump README cache-busters
        run: |
          set -euo pipefail

          V="$(date -u +%Y%m%d)"  # changes once per day

          # Update cache-buster for all wakatime SVG references in README
          sed -i -E "s#(wakatime/[a-z_]+\.svg)\?v=[0-9]+#\1?v=$V#g" README.md
          sed -i -E "s#(wakatime/[a-z_]+\.svg)(\"|')#\1?v=$V\2#g" README.md

      - name: Commit changes to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add wakatime/ README.md
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update WakaTime stats (cache-bust v=$(date -u +%Y%m%d))"
          git push
